name: Build VLC Android Stable 3.7.1 with Gemini AI Subtitles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - 'patch-parts/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: vlc-stable-3-7-1-gemini-ai-subtitle-build
  cancel-in-progress: true

jobs:
  build:
    name: Build VLC Android 3.7.1 Stable Universal Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      UPSTREAM_TAG: 3.7.1
      NDK_VERSION: 21.4.7075529

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

      - name: Fetch official VLC Android stable source and apply AI subtitle patch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/vlc-android"
          mkdir -p "$SRC"
          git -C "$SRC" init
          git -C "$SRC" remote add origin https://github.com/videolan/vlc-android.git
          git -C "$SRC" fetch --depth=1 origin "refs/tags/${UPSTREAM_TAG}"
          git -C "$SRC" checkout --detach FETCH_HEAD
          # Build #29 is the last verified complete AI-subtitle patch. Build #30
          # replaced the 25 chunks but truncated ai-patch-08.txt, so read the
          # known-good patch payload from its verified source commit instead.
          PATCH_SOURCE_COMMIT="829ec3c0d9facad8594b799765831f4a3946c281"
          PATCH_B64="$RUNNER_TEMP/vlc-ai-subtitle.patch.gz.b64"
          PATCH="$RUNNER_TEMP/vlc-ai-subtitle.patch"
          : > "$PATCH_B64"
          PART_COUNT=0
          for PART in "$GITHUB_WORKSPACE"/patch-parts/ai-patch-*.txt; do
            RELATIVE_PATH="${PART#"$GITHUB_WORKSPACE"/}"
            git -C "$GITHUB_WORKSPACE" show "$PATCH_SOURCE_COMMIT:$RELATIVE_PATH" >> "$PATCH_B64"
            PART_COUNT=$((PART_COUNT + 1))
          done
          test "$PART_COUNT" -eq 25
          base64 --decode "$PATCH_B64" | gzip -dc > "$PATCH"
          test -s "$PATCH"
          git -C "$SRC" apply --check "$PATCH"
          git -C "$SRC" apply "$PATCH"

          # Add the requested AI-translation controls to VLC Settings > Subtitles.
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(relative_path, old, new):
              path = root / relative_path
              data = path.read_text(encoding="utf-8")
              if data.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {relative_path}; found {data.count(old)}")
              path.write_text(data.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "application/vlc-android/res/xml/preferences_subtitles.xml",
              "</androidx.preference.PreferenceScreen>",
              """    <PreferenceCategory android:title="@string/ai_subtitle_settings_category">
                  <EditTextPreference
                      android:key="ai_gemini_api_key"
                      android:persistent="false"
                      android:inputType="textPassword"
                      android:title="@string/ai_subtitle_api_key_title"
                      android:dialogTitle="@string/ai_subtitle_api_key_title"
                      android:dialogMessage="@string/ai_subtitle_api_key_message" />
                  <EditTextPreference
                      android:defaultValue="Hindi"
                      android:key="ai_subtitle_target_language"
                      android:summary="%s"
                      android:title="@string/ai_subtitle_target_language_title"
                      android:dialogTitle="@string/ai_subtitle_target_language_title" />
                  <EditTextPreference
                      android:defaultValue="gemini-3.8-flash"
                      android:key="ai_subtitle_model"
                      android:summary="%s"
                      android:title="@string/ai_subtitle_model_title"
                      android:dialogTitle="@string/ai_subtitle_model_title" />
                  <CheckBoxPreference
                      android:defaultValue="false"
                      android:key="ai_subtitle_dual_language"
                      android:title="@string/ai_subtitle_dual_language_title"
                      android:summary="@string/ai_subtitle_dual_language_summary"
                      app:singleLineTitle="false" />
              </PreferenceCategory>

          </androidx.preference.PreferenceScreen>"""
          )

          strings = """    <string name="ai_subtitle_settings_category">AI subtitle translation</string>
          <string name="ai_subtitle_api_key_title">Gemini API key</string>
          <string name="ai_subtitle_api_key_message">Your key is stored using Android Keystore encryption. It is not saved as plain text in preferences.</string>
          <string name="ai_subtitle_api_key_not_set">No API key saved</string>
          <string name="ai_subtitle_api_key_saved">API key saved securely</string>
          <string name="ai_subtitle_target_language_title">Default translation language</string>
          <string name="ai_subtitle_model_title">Gemini model</string>
          <string name="ai_subtitle_dual_language_title">Show original and translated subtitles</string>
          <string name="ai_subtitle_dual_language_summary">Display the original line together with its translation</string>
          """
          path = root / "application/resources/src/main/res/values/strings.xml"
          data = path.read_text(encoding="utf-8")
          if "ai_subtitle_settings_category" in data:
              raise SystemExit("AI subtitle settings strings already exist; refusing to duplicate them")
          if data.count("</resources>") != 1:
              raise SystemExit("Could not locate one resources closing tag")
          path.write_text(data.replace("</resources>", strings + "\n</resources>", 1), encoding="utf-8")

          replace_once(
              "application/vlc-android/src/org/videolan/vlc/gui/preferences/PreferencesSubtitles.kt",
              "import androidx.preference.CheckBoxPreference\n",
              "import androidx.preference.CheckBoxPreference\nimport androidx.preference.EditTextPreference\n"
          )
          replace_once(
              "application/vlc-android/src/org/videolan/vlc/gui/preferences/PreferencesSubtitles.kt",
              "import org.videolan.vlc.gui.helpers.restartMediaPlayer\n",
              "import org.videolan.vlc.gui.helpers.restartMediaPlayer\nimport org.videolan.vlc.gui.video.ai.GeminiApiKeyStore\n"
          )
          replace_once(
              "application/vlc-android/src/org/videolan/vlc/gui/preferences/PreferencesSubtitles.kt",
              """        updatePreferredSubtitleTrack()
                  prepareLocaleList()
                  managePreferenceVisibilities()
          """,
              """        updatePreferredSubtitleTrack()
                  prepareLocaleList()
                  setupAiSubtitlePreferences()
                  managePreferenceVisibilities()
          """
          )
          replace_once(
              "application/vlc-android/src/org/videolan/vlc/gui/preferences/PreferencesSubtitles.kt",
              "    private fun resetAll() {",
              """    private fun setupAiSubtitlePreferences() {
                  val apiKeyPreference = findPreference<EditTextPreference>("ai_gemini_api_key") ?: return
                  fun updateApiKeySummary() {
                      apiKeyPreference.summary = getString(
                          if (GeminiApiKeyStore.load(requireContext()).isNullOrBlank())
                              R.string.ai_subtitle_api_key_not_set
                          else R.string.ai_subtitle_api_key_saved
                      )
                  }
                  apiKeyPreference.setOnBindEditTextListener { editText ->
                      editText.inputType = android.text.InputType.TYPE_CLASS_TEXT or
                          android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  updateApiKeySummary()
                  apiKeyPreference.setOnPreferenceChangeListener { _, newValue ->
                      val key = (newValue as? String).orEmpty().trim()
                      try {
                          if (key.isBlank()) GeminiApiKeyStore.clear(requireContext())
                          else GeminiApiKeyStore.save(requireContext(), key)
                          updateApiKeySummary()
                      } catch (_: Exception) {
                          // Keep the previous securely stored key when saving fails.
                      }
                      false // Never persist the API key in ordinary SharedPreferences.
                  }
              }

              private fun resetAll() {"""
          )

          PY

          # Apply the VLC-native extractor to the AI activity after the stable AI patch.
          AI_ACTIVITY="$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt"
          # Normalize the Kotlin TextView setter exactly as in the verified Build #29 source.
          sed -i 's/singleLine = true/setSingleLine(true)/g' "$AI_ACTIVITY"
          test "$(grep -c 'setSingleLine(true)' "$AI_ACTIVITY")" -eq 3
          NATIVE_PATCH_B64="$GITHUB_WORKSPACE/native/native-subtitle-extractor.patch.gz.b64"
          NATIVE_PATCH="$RUNNER_TEMP/vlc-native-subtitle-extractor.patch"
          base64 --decode "$NATIVE_PATCH_B64" | gzip -dc > "$NATIVE_PATCH"
          test -s "$NATIVE_PATCH"
          git -C "$SRC" apply --check "$NATIVE_PATCH"
          git -C "$SRC" apply "$NATIVE_PATCH"
          AI_ACTIVITY="$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt"
          # SubtitleCue stores the source text in `original`, not `text`.
          sed -i 's/append(cue\.text)/append(cue.original)/g' "$AI_ACTIVITY"
          grep -q 'append(cue.original)' "$AI_ACTIVITY"
          ! grep -q 'append(cue.text)' "$AI_ACTIVITY"
          grep -q 'extractWithVlcNativeDecoder' "$AI_ACTIVITY"
          grep -q 'scodec=t140,senc=t140' "$AI_ACTIVITY"
          ! grep -q 'android.media.MediaExtractor' "$AI_ACTIVITY"
          test "$(grep -c 'setSingleLine(true)' "$AI_ACTIVITY")" -eq 3
          ! grep -q 'singleLine = true' "$AI_ACTIVITY"

          # Use the stable Release launcher assets (orange/red cone), not the green Debug flavor.
          grep -q '@color/orange500' "$SRC/application/resources/src/main/res/drawable/ic_launcher_foreground.xml"
          test -f "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt"
          test -f "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslationWorker.kt"
          test -f "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/GeminiSubtitleClient.kt"
          test -f "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/GeminiApiKeyStore.kt"
          ! grep -q 'singleLine = true' "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt"
          grep -q 'setSingleLine(true)' "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt"
          # Preserve the exact post-patch Kotlin context and decoded native patch in CI diagnostics.
          mkdir -p "$RUNNER_TEMP/build-diagnostics"
          nl -ba "$SRC/application/vlc-android/src/org/videolan/vlc/gui/video/ai/AiSubtitleTranslateActivity.kt" | sed -n '380,410p' > "$RUNNER_TEMP/build-diagnostics/AiSubtitleTranslateActivity-lines-380-410.txt"
          cp "$NATIVE_PATCH" "$RUNNER_TEMP/build-diagnostics/vlc-native-subtitle-extractor.patch"
          # Keep Release as one universal APK rather than four ABI split APKs.
          sed -i 's/enable = isReleaseBuild/enable = false/' "$SRC/application/app/build.gradle"

          # Package the exact stable source tree with the custom patch applied.
          SOURCE_PACKAGE="$RUNNER_TEMP/VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source"
          mkdir -p "$SOURCE_PACKAGE/project/patches" "$SOURCE_PACKAGE/project/.github/workflows"
          cp -a "$SRC" "$SOURCE_PACKAGE/source"
          rm -rf "$SOURCE_PACKAGE/source/.git"
          cp "$PATCH" "$SOURCE_PACKAGE/project/patches/vlc-ai-subtitle.patch"
          cp "$NATIVE_PATCH" "$SOURCE_PACKAGE/project/patches/vlc-native-subtitle-extractor.patch"
          cp "$GITHUB_WORKSPACE/README.md" "$SOURCE_PACKAGE/project/"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-apk.yml" "$SOURCE_PACKAGE/project/.github/workflows/"
          cat > "$SOURCE_PACKAGE/SOURCE-INFO.txt" <<'INFO'
          Official VideoLAN VLC Android source tag: 3.7.1 (stable).
          Build variant: signedRelease (stable orange/red launcher icon; not green Debug flavor).
          Customization: original VLC theme; Next/Previous navigation; Gemini AI subtitle translation.
          External subtitles: SRT, WebVTT, ASS and SSA; best-effort embedded text tracks exposed by Android MediaExtractor.
          AI features: user-provided Gemini API key, resumable batches, progress, retry, timestamp-preserving SRT export.
          PGS/VobSub image subtitle tracks are not OCR converted; embedded cue end time can be approximate.
          Universal APK workflow targets ARM64, ARMv7, x86, and x86_64.
          INFO
          (cd "$RUNNER_TEMP" && zip -qr "$RUNNER_TEMP/VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source.zip" "VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source")

          printf 'sdk.dir=%s\nandroid.ndkFullVersion=%s\n' "$ANDROID_HOME" "$NDK_VERSION" > "$SRC/local.properties"
          # Debug uses the published LibVLC AAR; this placeholder is only for Gradle's included Dev project.
          mkdir -p "$SRC/libvlcjni/libvlc"
          printf '%s\n' '// Empty placeholder: Debug uses the published LibVLC AAR; native Dev build is not selected.' > "$SRC/libvlcjni/libvlc/build.gradle"
          echo "VLC_SOURCE_DIR=$SRC" >> "$GITHUB_ENV"
          echo "VLC_SOURCE_ZIP=$RUNNER_TEMP/VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source.zip" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/build-diagnostics"
          cp "$PATCH" "$RUNNER_TEMP/build-diagnostics/vlc-ai-subtitle.patch"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create temporary signing key for installable stable Release APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/vlc-stable-release.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VLC Stable Local Build,O=OpenAI,C=US"
          echo "VLC_SIGNING_KEY=$RUNNER_TEMP/vlc-stable-release.keystore" >> "$GITHUB_ENV"

      - name: Build stable universal signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle --no-daemon --stacktrace --max-workers=2 \
            -PkeyStoreFile="$VLC_SIGNING_KEY" \
            -Pstorealias=androiddebugkey \
            -Pstorepwd=android \
            -p "$VLC_SOURCE_DIR" \
            :application:app:assembleSignedRelease 2>&1 | tee "$RUNNER_TEMP/build-diagnostics/gradle-build.log"

      - name: Verify stable Release version, icon, signature and all four ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$VLC_SOURCE_DIR/application/app/build/outputs/apk"
          mkdir -p "$RUNNER_TEMP/vlc-apk"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' -size +0c | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected one universal signedRelease APK, found ${#APKS[@]}"
            printf '%s\\n' "${APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | tee "$RUNNER_TEMP/build-diagnostics/apk-badging.txt"
          echo "$BADGING" | grep -q "versionName='3.7.1'"
          echo "$BADGING" | grep -q "package: name='org.videolan.vlc'"
          grep -q '@color/orange500' "$VLC_SOURCE_DIR/application/resources/src/main/res/drawable/ic_launcher_foreground.xml"
          # Confirm the final APK really contains a resolvable launcher icon, not only that
          # the unmerged source XML happens to contain the VLC orange color.
          APP_ICON_LINE="$(printf '%s\n' "$BADGING" | grep -E '^application-icon(-[0-9]+)?:' | head -n 1)"
          test -n "$APP_ICON_LINE"
          APP_ICON_PATH="$(printf '%s\n' "$APP_ICON_LINE" | sed -E "s/^[^:]+:'([^']+)'.*/\\1/")"
          test -n "$APP_ICON_PATH"
          unzip -Z -1 "$APK" | grep -Fxq "$APP_ICON_PATH"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -Z -1 "$APK" | grep -q "^lib/$ABI/"
          done
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/vlc-apk/VLC-Android-3.7.1-Stable-Gemini-AI-Universal-Release.apk"
          echo "VLC_APK_PATH=$APK" >> "$GITHUB_ENV"
          {
            echo "Source: official videolan/vlc-android tag ${UPSTREAM_TAG}"
            echo "Variant: signedRelease; stable orange/red icon"
            echo "Features: Gemini subtitle translation; VLC-native T.140/RTP embedded text extraction; resume, progress, retry, SRT export"
            echo "Timing: cue start from VLC/RTP PTS; cue ends inferred from the following cue or fallback duration"
            echo "ABI: arm64-v8a, armeabi-v7a, x86, x86_64"
            echo "Signing: temporary local CI key (not VideoLAN Play Store signing key)"
          } > "$RUNNER_TEMP/vlc-apk/BUILD-SOURCE.txt"
          (cd "$RUNNER_TEMP/vlc-apk" && sha256sum *.apk)

      - name: Verify install on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install "$VLC_APK_PATH"
            adb shell pm path org.videolan.vlc

      - name: Upload stable universal signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-3.7.1-Stable-Gemini-AI-NextPrev-Universal-Release-APK
          path: ${{ runner.temp }}/vlc-apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable full source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source-ZIP
          path: ${{ runner.temp }}/VLC-Android-3.7.1-Stable-Gemini-AI-Full-Source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Stable-Gemini-Build-Diagnostics
          path: ${{ runner.temp }}/build-diagnostics/*
          if-no-files-found: warn
          retention-days: 7
