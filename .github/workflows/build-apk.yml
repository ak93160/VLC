name: Build VLC Android Stable 3.7.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: vlc-stable-3-7-1-original-theme-nextprev-build
  cancel-in-progress: true

jobs:
  build:
    name: Build VLC Android 3.7.1 Stable Universal Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      UPSTREAM_TAG: 3.7.1
      NDK_VERSION: 21.4.7075529

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

      - name: Fetch official VLC Android stable source tag
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/vlc-android"
          mkdir -p "$SRC"
          git -C "$SRC" init
          git -C "$SRC" remote add origin https://github.com/videolan/vlc-android.git
          git -C "$SRC" fetch --depth=1 origin "refs/tags/${UPSTREAM_TAG}"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" apply --check "$GITHUB_WORKSPACE/patches/vlc-next-prev.patch"
          git -C "$SRC" apply "$GITHUB_WORKSPACE/patches/vlc-next-prev.patch"

          # Package the exact stable source tree with the custom patch applied.
          SOURCE_PACKAGE="$RUNNER_TEMP/VLC-Android-3.7.1-Stable-Full-Source"
          mkdir -p "$SOURCE_PACKAGE/project/patches" "$SOURCE_PACKAGE/project/.github/workflows"
          cp -a "$SRC" "$SOURCE_PACKAGE/source"
          rm -rf "$SOURCE_PACKAGE/source/.git"
          cp "$GITHUB_WORKSPACE/patches/vlc-next-prev.patch" "$SOURCE_PACKAGE/project/patches/"
          cp "$GITHUB_WORKSPACE/README.md" "$SOURCE_PACKAGE/project/"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-apk.yml" "$SOURCE_PACKAGE/project/.github/workflows/"
          cat > "$SOURCE_PACKAGE/SOURCE-INFO.txt" <<'INFO'
          Official VideoLAN VLC Android source tag: 3.7.1 (stable).
          Customization: original VLC theme retained; Next/Previous video navigation patch applied.
          Universal APK workflow targets ARM64, ARMv7, x86, and x86_64.
          INFO
          (cd "$RUNNER_TEMP" && zip -qr "$RUNNER_TEMP/VLC-Android-3.7.1-Stable-Full-Source.zip" "VLC-Android-3.7.1-Stable-Full-Source")

          printf 'sdk.dir=%s\nandroid.ndkFullVersion=%s\n' "$ANDROID_HOME" "$NDK_VERSION" > "$SRC/local.properties"
          # Debug uses the published LibVLC AAR; this placeholder is only for Gradle's included Dev project.
          mkdir -p "$SRC/libvlcjni/libvlc"
          printf '%s\n' '// Empty placeholder: Debug uses the published LibVLC AAR; native Dev build is not selected.' > "$SRC/libvlcjni/libvlc/build.gradle"
          echo "VLC_SOURCE_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build stable universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --max-workers=2 \
            -p "$VLC_SOURCE_DIR" \
            :application:app:assembleDebug

      - name: Verify stable version and all four ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$VLC_SOURCE_DIR/application/app/build/outputs/apk"
          mkdir -p "$RUNNER_TEMP/vlc-apk"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' -size +0c | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected one universal Debug APK, found ${#APKS[@]}"
            printf '%s\\n' "${APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "versionName='3.7.1'"
          echo "$BADGING" | grep -q "package: name='org.videolan.vlc.debug'"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -Z -1 "$APK" | grep -q "^lib/$ABI/"
          done
          cp "$APK" "$RUNNER_TEMP/vlc-apk/VLC-Android-3.7.1-Stable-Universal-Debug.apk"
          {
            echo "Source: official videolan/vlc-android tag ${UPSTREAM_TAG}"
            echo "ABI: arm64-v8a, armeabi-v7a, x86, x86_64"
          } > "$RUNNER_TEMP/vlc-apk/BUILD-SOURCE.txt"
          (cd "$RUNNER_TEMP/vlc-apk" && sha256sum *.apk)

      - name: Upload stable universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-3.7.1-Stable-OriginalTheme-NextPrev-Universal-Debug-APK
          path: ${{ runner.temp }}/vlc-apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable full source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-3.7.1-Stable-Full-Source-ZIP
          path: ${{ runner.temp }}/VLC-Android-3.7.1-Stable-Full-Source.zip
          if-no-files-found: error
          retention-days: 14
